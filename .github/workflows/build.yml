name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install FUSE-T and XcodeGen
        run: |
          brew install --cask macos-fuse-t/homebrew-cask/fuse-t
          brew install xcodegen
          ls -l /usr/local/include/fuse /usr/local/lib/libfuse-t.dylib

      - name: Swift tests
        working-directory: app
        run: swift test

      - name: Engine C tests (no clip needed)
        working-directory: engine
        run: |
          make -f Makefile.arm64 resolve-name-test
          make -f Makefile.arm64 dual-iso-cache-test

      - name: Build app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh

      - name: Zip app
        run: ditto -c -k --keepParent build/mlv2dng.app mlv2dng-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mlv2dng-macos-arm64
          path: mlv2dng-macos-arm64.zip
          retention-days: 14
