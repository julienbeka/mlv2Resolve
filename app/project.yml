name: mlv2dng
options:
  bundleIdPrefix: net.mlv2dng
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
packages:
  MLV2DNGCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  mlv2dng:
    type: application
    platform: macOS
    sources:
      - MLV2DNG
    dependencies:
      - package: MLV2DNGCore
    info:
      path: MLV2DNG/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, fr]
        CFBundleName: mlv2dng
        CFBundleDisplayName: mlv2dng
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.mlv2dng.app
        PRODUCT_NAME: mlv2dng
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    postBuildScripts:
      - name: Bundle mlvfs engine
        basedOnDependencyAnalysis: false
        script: |
          set -e
          REPO="${SRCROOT}/.."
          RES="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Resources"
          mkdir -p "$RES"
          cp "$REPO/build/engine/mlvfs" "$RES/mlvfs"
          rm -rf "$RES/fpm"
          cp -R "$REPO/engine/mlvfs/fpm" "$RES/fpm"
          codesign --force -s - "$RES/mlvfs"
          codesign --force --deep -s - "${TARGET_BUILD_DIR}/${FULL_PRODUCT_NAME}"
